title: '[SPEC] Derivation data — component/allomorph inventory + per-form map'
status: closed
labels:
- needs-approval
body: '## Problem


  Stage-1 conversion needs its knowledge layer: the Wampanoag component/allomorph
  inventory and a per-unique-form derivation map over the corpus lexicon. Filed from
  ROADMAP.md (up-beeblum#3) per the developer directive (2026-11-24): "file the follow
  up specs based on the roadmap".


  ## Scope


  Build the component/allomorph table on the Nisinoon schema columns (Allomorph-A/Condition-A)
  — Fermino 2000 pp. 14–58 conditioning rules, cross-anchored to the corpus''s Goddard-1981
  proofed lines — and seed the per-form map over the corpus lexicon''s 66,863 match_keys
  with provenance classes (rule-derived / human-verdict / flagged). Deliverables land
  in this repo''s `data/derivations/` home; the `corpus/` submodule is consumed at
  its recorded pin, never modified.


  ## Out of scope


  - The conversion engine itself — roadmap item 3''s deliverable; this item produces
  only the data it consumes.

  - ML machinery — the assist belongs to the engine stage; the data layer declares
  provenance classes only.

  - Rendering — roadmap item 6''s deliverable.


  ## Requirements


  - **R-1:** The component/allomorph data SHALL encode Fermino''s conditioning system
  + prefix paradigms such that the table''s rules reproduce Fermino''s attested example
  paradigm rows (nuhkôt/kuhkôt/wuhkôt per uhkôt; n8sh/k8sh/8shah per 8sh; nutapun
  per apun).

  - **R-2:** The per-form map SHALL carry every form of the corpus lexicon (66,863
  match_keys) with a provenance class.

  - **R-3:** No form SHALL be silently assigned — unmapped forms SHALL carry the `flagged`
  class.

  - **R-4:** The inventory''s third-person conditioning rows SHALL reproduce the Goddard-1981
  attested prefix forms (uhquan, wuhkontash, wuhpit, uhpeteog (with its attestant
  wuhpeteog), wék) under their documented conditions, at the recorded pin.


  ## Impact


  Stage-1 conversion consumes this data — the engine stage''s work sits on this layer.
  R-3 is the derive-and-flag discipline''s data-side guarantee: unresolved readings
  stay flagged, never silently filled. Blast radius is confined to this repo''s data
  surfaces; `corpus/` is reference-only at its recorded pin.


  ## Approach


  The conditioning system is Fermino''s (stem-initial classes: consonant / dependent-vowel
  / 8-initial / non-dependent-vowel + intrusive t / 3rd-before-labial); Hicks 2006
  contributes initials/finals segmentation classes; every form carries a provenance
  flag from birth. The table''s rules are verified as reproducing the attested paradigms
  (Fermino''s examples) and the Goddard-1981 attested third-person forms — calibration
  stays item 3''s task.


  ## Success criteria


  | ID | Criterion | Class | Instrument |

  |------|-----------|-------|------------|

  | SC-1 | The table''s rules reproduce Fermino''s attested paradigm rows | structural
  | run the encoded conditioning rules over Fermino''s example set (uhkôt/8sh/apun
  paradigms); outputs match the thesis forms (R-1) |

  | SC-2 | Map keys cover the corpus lexicon 1:1 (66,863) | structural | set-compare
  lexicon match_keys vs map keys; zero missing (R-2) |

  | SC-3 | No form is silently assigned: every non-flagged row carries the provenance
  marker its class claims; rows lacking the marker carry `flagged` | structural |
  read the map; for each non-flagged row assert the stated rule/verdict provenance
  marker exists; assert every marker-less row carries `flagged` (R-3) |

  | SC-4 | The table''s third-person conditioning reproduces the Goddard-1981 attested
  forms | structural | run the table''s conditioning rules over the Goddard-attested
  stems; outputs match the attested forms (R-4) |


  > Full spec and plan artifacts: https://github.com/Brothertown-Language/up-beeblum/tree/issues-data/5/


